<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda PIB Vaz Lobo 2026</title>
    
    <!-- CSS e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .header-igreja { width: 100%; background: #fff; text-align: center; border-bottom: 3px solid #1a5f7a; }
        .header-igreja img { width: 100%; max-width: 100%; height: auto; display: block; }
        .container { padding: 15px; position: relative; max-width: 800px; margin: auto; }

        /* TELA DE INÍCIO / MENU */
        #tela-inicio { text-align: center; padding: 20px 10px; }
        .pergunta-agendamento { font-size: 1.3em; font-weight: bold; color: #1a5f7a; margin-bottom: 25px; }

        /* Estilo dos Botões 3D com efeito metalizado / brilhante */
        .botoes-menu { display: flex; flex-direction: column; gap: 20px; align-items: center; max-width: 450px; margin: 0 auto; }
        
        .btn-glossy {
            width: 100%; padding: 18px 20px; border-radius: 12px; font-size: 1.1em; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.5px; color: #ffffff; cursor: pointer; border: 2px solid #ffffff;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.8), inset 0 -4px 6px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: all 0.2s ease-in-out; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .btn-glossy:active { transform: translateY(3px); box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.8); }

        /* Cores Verde e Azul com Degradê Estilo Gel/Glossy */
        .btn-glossy-azul { background: linear-gradient(180deg, #3291b8 0%, #1a5f7a 50%, #0f3d50 100%); }
        .btn-glossy-verde { background: linear-gradient(180deg, #4caf50 0%, #2e7d32 50%, #1b4d1f 100%); }

        /* TELA DO CALENDÁRIO (INICIALMENTE OCULTA) */
        #tela-calendario { display: none; }
        
        .top-bar-cal { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        
        .btn-voltar {
            background: #666; color: white; border: none; padding: 10px 16px; border-radius: 8px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.85em;
        }

        /* Botão Reserve uma Data interno */
        .btn-reserva-interna {
            flex: 1; min-width: 200px; display: flex; align-items: center; justify-content: center; gap: 8px;
            color: white; text-align: center; padding: 12px 18px; border-radius: 8px; text-decoration: none; 
            font-weight: bold; font-size: 0.95em; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border: 2px solid #fff;
        }

        #custom-month-title { text-align: center; font-size: 1.8em; font-weight: bold; color: #1a5f7a; text-transform: uppercase; margin: 10px 0; }
        .calendario-card { background: white; border-radius: 15px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        
        /* Navegação do Calendário */
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: #1a5f7a; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .btn-prev { left: -10px; }
        .btn-next { right: -10px; }
        
        .fc-toolbar { display: none !important; }
        .view-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .view-selector button { padding: 8px 14px; border-radius: 20px; border: 1px solid #1a5f7a; background: white; color: #1a5f7a; font-weight: bold; font-size: 0.75em; text-transform: uppercase; cursor: pointer; }
        .view-selector button.active { background: #1a5f7a; color: white; }

        .footer { text-align: center; padding: 30px 20px; color: #777; font-size: 0.85em; line-height: 1.6; }
        
        .fc-list-event-time, .fc-list-day-side-text { display: none !important; } 
        .fc-event-title { white-space: normal !important; font-size: 0.85em; }
    </style>

        </div>

        <div class="botoes-menu">

    <!-- 2. TELA DO CALENDÁRIO FILTRADO -->
    <div id="tela-calendario">

            <button class="btn-voltar" onclick="voltarInicio()">

            <!-- Botão de Reserva Dinâmico -->
            <a id="btn-reserva-contato" href="#" class="btn-reserva-interna" target="_blank">
                <i class="fab fa-whatsapp"></i> RESERVE UMA DATA
            </a>
        </div>

        <div id="custom-month-title"></div>

        <!-- Alternar Exibição Mês/Lista -->
        <div class="view-selector">
            <button id="btn-mesh" class="active" onclick="changeView('dayGridMonth', this)">CALENDÁRIO</button>
            <button id="btn-lista" onclick="changeView('listMonth', this)">LISTA DE EVENTOS</button>
        </div>

        <!-- Card do Calendário -->
        <div class="calendario-card">
            <button class="nav-btn btn-prev" onclick="calPrev()">&#10094;</button>
            <button class="nav-btn btn-next" onclick="calNext()">&#10095;</button>
            <div id="calendar"></div>
        </div>
    </div>

    <!-- RODAPÉ FIXO -->
    <div class="footer">
        <b>"Até aqui o Senhor nos ajudou." (1 Samuel 7:12)</b><br>

    function abrirCalendario(tipo) {
        document.getElementById('tela-inicio').style.display = 'none';
        document.getElementById('tela-calendario').style.display = 'block';

        const btnReserva = document.getElementById('btn-reserva-contato');

        if (!calendarIniciado) {
            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'pt-br',
                initialView: 'dayGridMonth',
                height: 'auto',
                headerToolbar: false,
                displayEventTime: false,
                googleCalendarApiKey: GOOGLE_API_KEY,
                datesSet: function(info) {
                    var fullTitle = info.view.title;
                    var monthOnly = fullTitle.split(' de ')[0];
                    document.getElementById('custom-month-title').innerText = monthOnly;
                }
            });
            calendar.render();
            calendarIniciado = true;
        }

        // Limpa eventos antigos da tela
        var fontesAtivas = calendar.getEventSources();
        fontesAtivas.forEach(f => f.remove());

        // Carrega o calendário selecionado e ajusta os botões
        if (tipo === 'eventos') {
            calendar.addEventSource(fonteEventos);
            btnReserva.href = LINK_WA_EVENTOS;
            btnReserva.style.backgroundColor = "#1a5f7a";
        } else {
            calendar.addEventSource(fonteCantina);
            btnReserva.href = LINK_WA_CANTINA;
            btnReserva.style.backgroundColor = "#2e7d32";
        }
        
        calendar.updateSize();
    }

    function voltarInicio() {
        document.getElementById('tela-calendario').style.display = 'none';

    }

    function calPrev() { calendar.prev(); }
    function calNext() { calendar.next(); }
    function changeView(viewType, btn) {
        calendar.changeView(viewType);
        document.querySelectorAll('.view-selector button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
