<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda PIB Vaz Lobo 2026</title>
    
    <!-- CSS e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .header-igreja { width: 100%; background: #fff; text-align: center; border-bottom: 3px solid #1a5f7a; }
        .header-igreja img { width: 100%; max-width: 100%; height: auto; display: block; }
        .container { padding: 15px; position: relative; max-width: 800px; margin: auto; }

        /* Botões de Agendamento */
        .acoes-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-acao { 
            flex: 1; min-width: 250px; display: flex; align-items: center; justify-content: center; gap: 10px;
            color: white; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; 
            font-weight: bold; font-size: 0.95em; box-shadow: 0 4px 8px rgba(0,0,0,0.15); border: 2px solid #ffffff;
            transition: transform 0.2s;
        }
        .btn-acao:active { transform: scale(0.98); }
        .btn-evento { background-color: #1a5f7a; }
        .btn-cantina { background-color: #2e7d32; }
        .btn-acao i { font-size: 1.3em; } 

        #custom-month-title { text-align: center; font-size: 1.8em; font-weight: bold; color: #1a5f7a; text-transform: uppercase; margin: 10px 0; }
        .calendario-card { background: white; border-radius: 15px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        
        /* Navegação */
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: #1a5f7a; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .btn-prev { left: -10px; }
        .btn-next { right: -10px; }
        
        .fc-toolbar { display: none !important; }
        .view-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .view-selector button { padding: 10px 15px; border-radius: 20px; border: 1px solid #1a5f7a; background: white; color: #1a5f7a; font-weight: bold; font-size: 0.8em; text-transform: uppercase; cursor: pointer; }
        .view-selector button.active { background: #1a5f7a; color: white; }
        
        /* Legenda de Cores */
        .legenda { display: flex; justify-content: center; gap: 15px; margin-top: 15px; font-size: 0.85em; font-weight: bold; }
        .legenda-item { display: flex; align-items: center; gap: 5px; }
        .cor-box { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

        .footer { text-align: center; padding: 30px 20px; color: #777; font-size: 0.85em; line-height: 1.6; }
        
        .fc-list-event-time, .fc-list-day-side-text { display: none !important; } 
        .fc-event-title { white-space: normal !important; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="header-igreja">
    <img src="https://raw.githubusercontent.com/pibdevazlobo1939/agenda-igreja/main/logo_calendario%20da%20igreja2026.jpg" alt="PIB Vaz Lobo">
</div>

<div class="container">
    
    <!-- Botões de Reserva do WhatsApp -->
    <div class="acoes-container">
        <a href="https://wa.me/5521966709417?text=Olá,%20gostaria%20de%20agendar%20um%20evento%20ou%20atividade." class="btn-acao btn-evento" target="_blank">
            <i class="fab fa-whatsapp"></i> AGENDAR EVENTO / ATIVIDADE
        </a>
        <a href="https://wa.me/5521966709417?text=Olá,%20gostaria%20de%20reservar%20uma%20data%20para%20a%20Cantina." class="btn-acao btn-cantina" target="_blank">
            <i class="fas fa-utensils"></i> RESERVAR CANTINA
        </a>
    </div>

    <div id="custom-month-title"></div>

    <!-- Alternar Exibição -->
    <div class="view-selector">
        <button id="btn-mesh" class="active" onclick="changeView('dayGridMonth', this)">CALENDÁRIO</button>
        <button id="btn-lista" onclick="changeView('listMonth', this)">LISTA DE EVENTOS</button>
    </div>

    <!-- Card do Calendário -->
    <div class="calendario-card">
        <button class="nav-btn btn-prev" onclick="calPrev()">&#10094;</button>
        <button class="nav-btn btn-next" onclick="calNext()">&#10095;</button>
        <div id="calendar"></div>
    </div>

    <!-- Legenda para facilidade dos membros -->
    <div class="legenda">
        <div class="legenda-item"><span class="cor-box" style="background-color: #1a5f7a;"></span> Eventos e Cultos</div>
        <div class="legenda-item"><span class="cor-box" style="background-color: #2e7d32;"></span> Cantinas</div>
    </div>
</div>

<div class="footer">
    <b>"Até aqui o Senhor nos ajudou." (1 Samuel 7:12)</b><br>
    <i>Desenvolvido pela equipe de Comunicação PIBVL</i>
</div>

<!-- Bibliotecas do FullCalendar e Plugin do Google Calendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/pt-br.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@5.11.3/main.min.js"></script>

<script>
    var calendar;

    // === CONFIGURAÇÕES DO GOOGLE CALENDAR ===
    const GOOGLE_API_KEY = 'AIzaSyCFYYuGZzT-wAz1K1QdLfpQ8w5h5j5mrZ4';

    // Cole os IDs das duas agendas abaixo:
    const ID_AGENDA_EVENTOS = '';
    const ID_AGENDA_CANTINA = 'e8131609e45e45262631caec0830f90b5514240178b41ee49515c03d0b7c9038@group.calendar.google.com';

    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');

        calendar = new FullCalendar.Calendar(calendarEl, {
            locale: 'pt-br',
            initialView: 'dayGridMonth',
            height: 'auto',
            headerToolbar: false,
            displayEventTime: false, 
            
            // Ativa o suporte ao Google Calendar
            googleCalendarApiKey: GOOGLE_API_KEY,

            // Puxa as 2 agendas separadas com cores distintas
            eventSources: [
                {
                    googleCalendarId: ID_AGENDA_EVENTOS,
                    color: '#1a5f7a', // Azul para eventos
                    textColor: '#ffffff'
                },
                {
                    googleCalendarId: ID_AGENDA_CANTINA,
                    color: '#2e7d32', // Verde para cantinas
                    textColor: '#ffffff'
                }
            ],

            datesSet: function(info) {
                var fullTitle = info.view.title;
                var monthOnly = fullTitle.split(' de ')[0];
                document.getElementById('custom-month-title').innerText = monthOnly;
            }
        });

        calendar.render();
    });

    function calPrev() { calendar.prev(); }
    function calNext() { calendar.next(); }
    function changeView(viewType, btn) {
        calendar.changeView(viewType);
        document.querySelectorAll('.view-selector button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
</script>
</body>
</html>
