<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendário da Comunicação - PIBVL</title>
    
    <!-- CSS, FontAwesome & FullCalendar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .header-igreja { width: 100%; background: #1a5f7a; text-align: center; padding: 25px 10px; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .header-igreja h1 { margin: 0; font-size: 1.6em; text-transform: uppercase; letter-spacing: 1px; }
        .container { padding: 15px; position: relative; max-width: 900px; margin: auto; }

        /* TELA DE INÍCIO */
        #tela-inicio { text-align: center; padding: 30px 10px; }
        .titulo-menu { font-size: 1.4em; font-weight: bold; color: #1a5f7a; margin-bottom: 25px; }

        .botoes-menu { display: flex; flex-direction: column; gap: 20px; align-items: center; max-width: 450px; margin: 0 auto; }
        .btn-glossy {
            width: 100%; padding: 18px 20px; border-radius: 12px; font-size: 1.1em; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.5px; color: #ffffff; cursor: pointer; border: 2px solid #ffffff;
            box-shadow: 0 8px 15px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.8), inset 0 -4px 6px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: all 0.2s ease-in-out; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .btn-glossy:active { transform: translateY(3px); box-shadow: 0 3px 6px rgba(0,0,0,0.3); }
        .btn-glossy-azul { background: linear-gradient(180deg, #3291b8 0%, #1a5f7a 50%, #0f3d50 100%); }
        .btn-glossy-roxo { background: linear-gradient(180deg, #8e44ad 0%, #6c3483 50%, #4a235a 100%); }

        /* TELA CALENDÁRIO */
        #tela-calendario { display: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .btn-voltar { background: #666; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.85em; }
        #custom-month-title { text-align: center; font-size: 1.8em; font-weight: bold; color: #1a5f7a; text-transform: uppercase; margin: 10px 0; }
        .calendario-card { background: white; border-radius: 15px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: #1a5f7a; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .btn-prev { left: -10px; }
        .btn-next { right: -10px; }
        .fc-toolbar { display: none !important; }
        .fc-event-title { white-space: normal !important; font-size: 0.85em; font-weight: bold; cursor: pointer; }
        .view-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .view-selector button { padding: 10px 16px; border-radius: 20px; border: 1px solid #1a5f7a; background: white; color: #1a5f7a; font-weight: bold; font-size: 0.8em; text-transform: uppercase; cursor: pointer; }
        .view-selector button.active { background: #1a5f7a; color: white; }

        /* TELA OBJETIVOS (KANBAN) */
        #tela-objetivos { display: none; }
        .kanban-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-top: 15px; }
        .kanban-column { background: #ebedf0; border-radius: 12px; padding: 12px; min-height: 400px; display: flex; flex-direction: column; }
        .kanban-column h3 { font-size: 1em; text-transform: uppercase; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .col-desejos h3 { color: #d35400; border-color: #e67e22; }
        .col-proximos h3 { color: #2980b9; border-color: #3498db; }
        .col-realizados h3 { color: #27ae60; border-color: #2ecc71; }
        .kanban-card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 8px; }
        .kanban-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
        .kanban-card .card-title { font-weight: bold; font-size: 1em; color: #333; }
        .kanban-card .card-desc { font-size: 0.85em; color: #666; margin: 0; }
        .kanban-card .card-link { font-size: 0.8em; color: #1a5f7a; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
        .card-actions { display: flex; justify-content: space-between; margin-top: 5px; border-top: 1px solid #eee; padding-top: 8px; }
        .btn-move { background: #f0f0f0; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75em; font-weight: bold; color: #444; }

        .footer { text-align: center; padding: 30px 20px; color: #777; font-size: 0.85em; line-height: 1.6; }
    </style>
</head>
<body>

<div class="header-igreja">
    <h1>Calendário da Comunicação</h1>
</div>

<div class="container">

    <!-- 1. TELA INICIAL -->
    <div id="tela-inicio">
        <div class="titulo-menu">MINISTÉRIO DE COMUNICAÇÃO - PIBVL</div>
        <div class="botoes-menu">
            <button class="btn-glossy btn-glossy-azul" onclick="abrirTela('calendario')">
                <i class="fas fa-calendar-alt"></i> Calendário da Equipe
            </button>
            <button class="btn-glossy btn-glossy-roxo" onclick="abrirTela('objetivos')">
                <i class="fas fa-bullseye"></i> Objetivos & Conquistas
            </button>
        </div>
    </div>

    <!-- 2. TELA DO CALENDÁRIO -->
    <div id="tela-calendario">
        <div class="top-bar">
            <button class="btn-voltar" onclick="voltarInicio()">
                <i class="fas fa-arrow-left"></i> Voltar ao Menu
            </button>
        </div>

        <div id="custom-month-title"></div>

        <div class="view-selector">
            <button id="btn-mesh" class="active" onclick="changeView('dayGridMonth', this)">Calendário Visão Geral</button>
            <button id="btn-lista" onclick="changeView('listMonth', this)">Artes do Mês & Responsáveis</button>
        </div>

        <div class="calendario-card">
            <button class="nav-btn btn-prev" onclick="calPrev()">&#10094;</button>
            <button class="nav-btn btn-next" onclick="calNext()">&#10095;</button>
            <div id="calendar"></div>
        </div>
    </div>

    <!-- 3. TELA DE OBJETIVOS (KANBAN) -->
    <div id="tela-objetivos">
        <div class="top-bar">
            <button class="btn-voltar" onclick="voltarInicio()">
                <i class="fas fa-arrow-left"></i> Voltar ao Menu
            </button>
        </div>

        <h2 style="text-align: center; color: #1a5f7a; margin-top: 0;">Metas & Equipamentos</h2>

        <div class="kanban-board">
            <div class="kanban-column col-desejos">
                <h3>Desejos <i class="fas fa-lightbulb"></i></h3>
                <div id="lista-desejos"></div>
            </div>
            <div class="kanban-column col-proximos">
                <h3>Próximos Passos <i class="fas fa-hourglass-half"></i></h3>
                <div id="lista-proximos"></div>
            </div>
            <div class="kanban-column col-realizados">
                <h3>Realizados <i class="fas fa-check-circle"></i></h3>
                <div id="lista-realizados"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <b>"Até aqui o Senhor nos ajudou." (1 Samuel 7:12)</b><br>
        <i>Equipe de Comunicação PIBVL</i>
    </div>
</div>

    // 2. TAREFAS DE CRIAÇÃO DE ARTES DA COMUNICAÇÃO
    const artesEscala = [
        { titulo: 'Arte: Mês da Juventude', data: '2026-08-01', responsavel: 'Sarah', envio: '25/07/2026' },
        { titulo: 'Arte: Quarto de Guerra', data: '2026-09-11', responsavel: 'Sarah', envio: '04/09/2026' },

        { titulo: 'Arte: Imersão', data: '2026-10-02', responsavel: 'Lucas', envio: '25/09/2026' },
        { titulo: 'Arte: Imersão', data: '2026-10-03', responsavel: 'Lucas', envio: '26/09/2026' },
        { titulo: 'Arte: Imersão', data: '2026-10-04', responsavel: 'Lucas', envio: '27/09/2026' },
        { titulo: 'Arte: Dia das Crianças', data: '2026-10-11', responsavel: 'Lucas', envio: '04/10/2026' },
        { titulo: 'Arte: Dia do Educador Cristão', data: '2026-10-18', responsavel: 'Lucas', envio: '11/10/2026' },
        { titulo: 'Arte: Dia da Reforma Protestante', data: '2026-10-21', responsavel: 'Sarah', envio: '14/10/2026' },
        { titulo: 'Arte: Culto da Dança', data: '2026-10-31', responsavel: 'Sarah', envio: '24/10/2026' },
        { titulo: 'Arte: Dia da Bíblia', data: '2026-12-13', responsavel: 'Lucas', envio: '06/12/2026' },
        { titulo: 'Arte: Ano Novo', data: '2026-12-31', responsavel: 'Sarah', envio: '24/12/2026' }
    ];

    function gerarEventosLocais() {
        let eventos = [];
        let datasReservadas = new Set();

        // Adicionar Escala de Artes
        artesEscala.forEach(arte => {
            eventos.push({
                title: `${arte.titulo} - ${arte.responsavel}`,
                start: arte.data,
                color: '#8e44ad',
                textColor: '#ffffff',
                extendedProps: {
                    tipo: 'arte',
                    responsavel: arte.responsavel,
                    envio: arte.envio
                }
            });
        });

        // Adicionar Aniversariantes do PDF
        membrosPdf.forEach(membro => {
            let dataCompleta = `2026-${membro.data}`;
            datasReservadas.add(dataCompleta);
            eventos.push({
                title: `🎂 Aniversário: ${membro.nome}`,
                start: dataCompleta,
                color: '#e67e22',
                textColor: '#ffffff',
                extendedProps: { tipo: 'aniversario' }
            });
        });

        // Versículos Automáticos (Segundas e Sextas)
        let dataAtual = new Date(2026, 0, 1);
        let dataFim = new Date(2026, 11, 31);

        while (dataAtual <= dataFim) {
            let diaSemana = dataAtual.getDay();
            let dataIso = dataAtual.toISOString().split('T')[0];

            if ((diaSemana === 1 || diaSemana === 5) && !datasReservadas.has(dataIso)) {
                eventos.push({
                    title: '📖 Versículo do Dia (Canva)',
                    start: dataIso,
                    color: '#27ae60',
                    textColor: '#ffffff',
                    url: 'https://www.canva.com',
                    extendedProps: { tipo: 'versiculo' }
                });
            }
            dataAtual.setDate(dataAtual.getDate() + 1);
        }

        return eventos;
    }

    /* KANBAN DATA */
    let ObjetivosData = [
        {
            id: 1,
            titulo: 'Câmera Sony A7 III',
            descricao: 'Melhorar a qualidade das transmissões e fotos.',
            foto: 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=400',

            status: 'desejos'
        }

    function abrirTela(tipo) {
        document.getElementById('tela-inicio').style.display = 'none';
        
        if (tipo === 'calendario') {
            document.getElementById('tela-calendario').style.display = 'block';
            if (!calendarIniciado) {
                var calendarEl = document.getElementById('calendar');
                calendar = new FullCalendar.Calendar(calendarEl, {
                    locale: 'pt-br',
                    initialView: 'dayGridMonth',
                    height: 'auto',
                    headerToolbar: false,
                    displayEventTime: false,
                    googleCalendarApiKey: GOOGLE_API_KEY,
                    eventSources: [
                        {
                            events: gerarEventosLocais()
                        },
                        {
                            googleCalendarId: ID_AGENDA_COMUNICACAO,
                            color: '#1a5f7a',
                            textColor: '#ffffff'
                        }
                    ],
                    eventClick: function(info) {
                        if (info.event.extendedProps.tipo === 'versiculo') {
                            info.jsEvent.preventDefault();
                            window.open('https://www.canva.com', '_blank');
                        } else if (info.event.extendedProps.tipo === 'arte') {
                            info.jsEvent.preventDefault();
                            alert(`🎨 EVENTO DE CRIAÇÃO DE ARTE\n\n📌 Arte: ${info.event.title}\n👤 Responsável: ${info.event.extendedProps.responsavel}\n⚠️ ATENÇÃO: Enviar a arte pronta no grupo até ${info.event.extendedProps.envio} (1 semana de antecedência)!`);
                        }
                    },
                    datesSet: function(info) {
                        var fullTitle = info.view.title;
                        var monthOnly = fullTitle.split(' de ')[0];
                        document.getElementById('custom-month-title').innerText = monthOnly;
                    }
                });
                calendar.render();
                calendarIniciado = true;
            }
            calendar.updateSize();
        } else if (tipo === 'objetivos') {
            document.getElementById('tela-objetivos').style.display = 'block';
            renderizarKanban();
        }
    }

    function voltarInicio() {
        document.getElementById('tela-calendario').style.display = 'none';
        document.getElementById('tela-objetivos').style.display = 'none';
        document.getElementById('tela-inicio').style.display = 'block';
    }

    function calPrev() { calendar.prev(); }
    function calNext() { calendar.next(); }
    function changeView(viewType, btn) {
        calendar.changeView(viewType);
        document.querySelectorAll('.view-selector button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function renderizarKanban() {
        const colDesejos = document.getElementById('lista-desejos');
        const colProximos = document.getElementById('lista-proximos');
        const colRealizados = document.getElementById('lista-realizados');

        colDesejos.innerHTML = '';
        colProximos.innerHTML = '';
        colRealizados.innerHTML = '';

        ObjetivosData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'kanban-card';
            
            let btnEsquerda = '';
            let btnDireita = '';

            if (item.status === 'desejos') {
                btnDireita = `<button class="btn-move" onclick="moverStatus(${item.id}, 'proximos')">Avançar ➔</button>`;
            } else if (item.status === 'proximos') {
                btnEsquerda = `<button class="btn-move" onclick="moverStatus(${item.id}, 'desejos')">⬅ Voltar</button>`;
                btnDireita = `<button class="btn-move" onclick="moverStatus(${item.id}, 'realizados')">Concluir ➔</button>`;
            } else if (item.status === 'realizados') {
                btnEsquerda = `<button class="btn-move" onclick="moverStatus(${item.id}, 'proximos')">⬅ Voltar</button>`;
            }

            card.innerHTML = `
                ${item.foto ? `<img src="${item.foto}" alt="${item.titulo}">` : ''}
                <div class="card-title">${item.titulo}</div>
                <p class="card-desc">${item.descricao}</p>
                ${item.link ? `<a href="${item.link}" target="_blank" class="card-link"><i class="fas fa-external-link-alt"></i> Ver Loja / Preço</a>` : ''}
                <div class="card-actions">
                    ${btnEsquerda}
                    ${btnDireita}
                </div>
            `;

            if (item.status === 'desejos') colDesejos.appendChild(card);
            else if (item.status === 'proximos') colProximos.appendChild(card);
            else if (item.status === 'realizados') colRealizados.appendChild(card);
        });
    }

    function moverStatus(id, novoStatus) {
        const item = ObjetivosData.find(obj => obj.id === id);
        if (item) {
            item.status = novoStatus;
            renderizarKanban();
        }
    }
</script>
